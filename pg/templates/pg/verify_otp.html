<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - Sudarshan PG</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #5a3825;
        }

        p {
            color: #555;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
        }

        button {
            background: #5a3825;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3e2618;
        }

        .message {
            margin-bottom: 15px;
            color: #b00020;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>OTP Verification</h1>

    <p>
        Enter the 6-digit OTP generated for your login.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="otp"
            placeholder="Enter OTP"
            maxlength="6"
            required
        >

        <br>

        <button type="submit">
            Verify OTP
        </button>

    </form>

</div>

</body>
</html>
