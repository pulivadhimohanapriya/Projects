<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudarshan PG - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background-color: #5a3825;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        nav {
            background-color: #3e2618;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
        }

        .login-card {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        }

        .title {
            text-align: center;
            color: #5a3825;
            margin-bottom: 25px;
        }

        .message {
            background-color: #f2dede;
            color: #a94442;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        .button {
            width: 100%;
            background-color: #5a3825;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .button:hover {
            background-color: #3e2618;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #5a3825;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        footer {
            background-color: #3e2618;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 80px;
        }
    </style>
</head>

<body>

<header>
    <h1>Sudarshan PG</h1>
    <p>User Login</p>
</header>

<nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'rooms' %}">Rooms</a>
    <a href="{% url 'facilities' %}">Facilities</a>
    <a href="{% url 'gallery' %}">Gallery</a>
    <a href="{% url 'contact' %}">Contact</a>
</nav>

<div class="container">

    <div class="login-card">

        <h1 class="title">Login</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="button">
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="{% url 'register' %}">
                Register here
            </a>
        </div>

    </div>

</div>

<footer>
    © 2026 Sudarshan PG. All Rights Reserved.
</footer>

</body>
</html>
